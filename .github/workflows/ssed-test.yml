name: Run Flow and Commit Output

on:
  push:
    branches:
      - test-sed
      - master
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
jobs:
  run-flow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures all branches are available

      - name: Configure Git
        run: |
          git config --global user.name "deenath400"
          git config --global user.email "deenath400@digital400.com"

      - name: Create or Switch to Output Branch
        run: |
          git checkout -B output-branch

      - name: Run Flow
        run: |
          sed -i 's|<GOOGLE_CREDENTIALS_JSON>|${{secrets.GOOGLE_CREDENTIALS_JSON}}|g' appsettings.json

      - name: Update Remote URL
        env:
          GH_PAT: ${{ secrets.YOUR_PAT_SECRET }}
        run: |
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/deenath400/git-test.git
          git remote -v

      - name: Push Changes to Branch
        run: |
          git push origin output-branch --force
